{% extends "base.html" %}
{% block contenido %}
<div class="tarjeta">
    <div class="emoji-grande">🎄</div>
    <h1>Intercambio Navideño 🎁</h1>
    <p>Pega el código de tu grupo y escribe tu nombre</p>

    <form method="POST">
        <input type="text" name="codigo" class="codigo" placeholder="Código del grupo"
               value="{{ codigo or '' }}" maxlength="12" autocomplete="off"
               autocapitalize="characters" spellcheck="false" required>
        <label class="campo" for="usuario">Tu nombre</label>
        <input type="text" id="usuario" name="usuario" placeholder="Ej. Tía Carla"
               value="{{ nombre or '' }}" maxlength="40" required>
        <button type="submit" class="btn">Entrar 🎅</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <p class="ayuda">¿Ya te habías registrado? Escribe tu nombre igual que la primera vez.<br>
        ¿Primera vez? <a href="{{ url_for('manual') }}">Lee el mini manual 📖</a></p>
</div>
{% endblock %}
